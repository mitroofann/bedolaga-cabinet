<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 148 352 252" fill="none">
<defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <linearGradient id="dough" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#F0AE4B"/>
    <stop offset="1" stop-color="#C46A1E"/>
  </linearGradient>
  <linearGradient id="glaze" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#FBDDA0"/>
    <stop offset="1" stop-color="#E7B063"/>
  </linearGradient>
</defs>

<!-- тень на поверхности -->
<ellipse cx="286" cy="356" rx="150" ry="34" fill="#000000" opacity=".38" filter="url(#soft)"/>

<!-- НИЖНИЙ слой: бок пончика (толщина) -->
<path fill-rule="evenodd" fill="#A85614" d="M132 272 a148 90 0 1 0 296 0 a148 90 0 1 0 -296 0 M224 270 a56 34 0 1 0 112 0 a56 34 0 1 0 -112 0"/>

<!-- ВЕРХ: тесто -->
<path fill-rule="evenodd" fill="url(#dough)" d="M132 246 a148 90 0 1 0 296 0 a148 90 0 1 0 -296 0 M224 244 a56 34 0 1 0 112 0 a56 34 0 1 0 -112 0"/>

<!-- ГЛАЗУРЬ со стёками -->
