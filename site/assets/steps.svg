  <g transform="translate(384 236) rotate(-30)"><path d="M0 -8 V8" stroke="#74DF8B"/></g>
</g>

<!-- НАДКУС с ближней стороны (увеличен ×2) -->
<g transform="translate(330 332) scale(2) translate(-330 -332)">
  <path fill="#F6DBA6" stroke="#B0611B" stroke-width="2.5" stroke-linejoin="round"
    d="M300 322 q10 -16 22 -9 q6 -13 18 -7 q9 -11 19 -2 q10 8 6 20 q-3 16 -22 18 q-20 2 -33 -6 q-14 -9 -10 -22 z"/>
  <path d="M312 330 q10 -10 22 -6 q10 2 12 14" fill="none" stroke="#E7B063" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</g>

<!-- крошки -->
