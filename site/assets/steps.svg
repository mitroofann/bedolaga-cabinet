  <g transform="translate(362 218) rotate(60)"><path d="M0 -8 V8" stroke="#FFF6E4"/></g>
  <g transform="translate(186 232) rotate(-15)"><path d="M0 -8 V8" stroke="#C46A1E"/></g>
  <g transform="translate(226 248) rotate(70)"><path d="M0 -7 V7" stroke="#FFF6E4"/></g>
  <g transform="translate(300 250) rotate(-55)"><path d="M0 -7 V7" stroke="#74DF8B"/></g>
